# Perfil dos testes de integração: a infraestrutura vem do Testcontainers (@ServiceConnection).
management:
  server:
    port: 0

logging:
  structured:
    format:
      console: ""

app:
  # O JWKS de teste (TestJwks) sobrescreve o jwk-set-uri no contexto dos testes de integração; este endereço, sem
  # ninguém escutando, vale para as instâncias que não validam tokens, como a do teste sem brokers.
  jwt:
    issuer: http://auth.test
    jwk-set-uri: http://127.0.0.1:9/oauth2/jwks
    jwks:
      # Sem o limite de buscas fora de hora entre classes: com 30 s, um kid desconhecido de um teste barraria a rotação
      # do seguinte. O limite é coberto no teste do decodificador.
      min-refresh-interval: 10ms
  # Curto para que o disjuntor feche logo depois dos testes de degradação, sem atrasar as classes seguintes.
  redis-guard:
    open-duration: 1s
  # Todos os testes saem do mesmo IP: com os limites reais, uma classe esgotaria a cota da seguinte. O teste do rate
  # limit preenche o contador até o limite em vez de depender destes números.
  rate-limit:
    link-creation: { requests: 1000000 }
    user-stats: { requests: 1000000 }
