# Perfil de desenvolvimento: sobe o compose.yaml (PostgreSQL e Redis) e usa a chave e o segredo de desenvolvimento.
# Uso: ./mvnw -pl apps/auth-server -am spring-boot:run
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
  security:
    oauth2:
      authorizationserver:
        client:
          encurtador-web:
            registration:
              client-secret: "{noop}dev-web-secret"
              redirect-uris: http://localhost:8070/login/oauth2/code/encurtador,http://localhost:4200/login/oauth2/code/encurtador
              post-logout-redirect-uris: http://localhost:8070/,http://localhost:4200/
          # Postman e Swagger UI do app: só no perfil local (ADR-0003, D3).
          encurtador-dev:
            registration:
              client-id: encurtador-dev
              client-authentication-methods: none
              authorization-grant-types: authorization_code
              redirect-uris: https://oauth.pstmn.io/v1/callback,http://localhost:8080/swagger-ui/oauth2-redirect.html
              scopes: openid,email
            require-proof-key: true
            token:
              access-token-time-to-live: 15m

logging:
  structured:
    format:
      console: ""

app:
  auth:
    signing-key:
      # SOMENTE para desenvolvimento local. Nunca reutilize esta chave fora do perfil "local".
      id: dev-1
      location: classpath:keys/dev-signing-key.pem
    panel-origins: http://localhost:8070,http://localhost:4200
  # O Swagger UI do app chama /oauth2/token de outra origem.
  cors:
    allowed-origins: http://localhost:8080
