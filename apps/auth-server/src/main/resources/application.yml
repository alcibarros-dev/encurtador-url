# Servidor de autorização (ADR-0003). Configuração padrão (produção): endereços, chave e segredos vêm de variáveis de
# ambiente. Perfis: "local" (application-local.yml) e "test" (src/test/resources).
spring:
  application:
    name: encurtador-auth-server
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      # Tudo do servidor de autorização vive no schema "auth", com usuário de banco próprio fora do local (D8).
      schema: auth
      connection-timeout: 2000
  flyway:
    schemas: auth
    default-schema: auth
  data:
    redis:
      timeout: 100ms
      connect-timeout: 200ms
  web:
    locale: pt_BR
    locale-resolver: fixed
  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_ISSUER:http://localhost:8090}
        client:
          # Terminal e curl: fluxo de dispositivo, com confirmação de cada código e sem refresh token (D3).
          encurtador-cli:
            registration:
              client-id: encurtador-cli
              client-authentication-methods: none
              authorization-grant-types: urn:ietf:params:oauth:grant-type:device_code
              # O SAS não aceita openid no fluxo de dispositivo, que não emite id_token.
              scopes: email
            require-authorization-consent: true
            token:
              access-token-time-to-live: 15m
          # BFF do painel (ADR-0004, D4): confidencial, PKCE e refresh token sem rotação por 30 dias.
          encurtador-web:
            registration:
              client-id: encurtador-web
              client-secret: "{noop}${AUTH_WEB_CLIENT_SECRET}"
              client-authentication-methods: client_secret_basic
              authorization-grant-types: authorization_code,refresh_token
              redirect-uris: ${AUTH_WEB_REDIRECT_URIS}
              post-logout-redirect-uris: ${AUTH_WEB_POST_LOGOUT_REDIRECT_URIS}
              scopes: openid,email
            require-proof-key: true
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 30d
              reuse-refresh-tokens: true

server:
  port: 8090
  shutdown: graceful
  servlet:
    session:
      # Cookies de localhost não se separam por porta: o painel e o app usam outros nomes (D2).
      cookie:
        name: AUTHSESSION
        http-only: true
        same-site: lax

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    java:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never

logging:
  structured:
    format:
      console: ecs

app:
  # As páginas mostram os erros em HTML; o problem+json do shared fica desligado (ADR-0002, notas).
  errors:
    problem-details: false
  base-url: ${AUTH_ISSUER:http://localhost:8090}
  auth:
    audience: encurtador-api
    signing-key:
      id: ${AUTH_SIGNING_KEY_ID:auth-1}
      location: ${AUTH_SIGNING_KEY_FILE:}
    panel-origins: ${AUTH_PANEL_ORIGINS:http://localhost:8070}
    panel-default-url: ${AUTH_PANEL_DEFAULT_URL:http://localhost:8070/}
  redis-guard:
    failure-threshold: 5
    open-duration: 5s
  rate-limit:
    login: { requests: 10, window: 1m }
    login-email: { requests: 5, window: 15m }
    register: { requests: 10, window: 1h }
    password-change: { requests: 5, window: 15m }
    token: { requests: 30, window: 1m }
    token-client: { requests: 600, window: 1m }
    device-authorization: { requests: 10, window: 1m }
    device-verification: { requests: 10, window: 1m }
