name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # As bibliotecas de segurança vêm do GitHub Packages do repositório alcibarros-dev/auth (ADR-0007, D7).
  packages: read

# O .mvn/github-settings.xml lê o token daqui; o GITHUB_ACTOR já vem do Actions.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # Testcontainers usa o Docker disponível no runner (ADR-0001, D14).
      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: tools/coverage/target/site/jacoco-aggregate/
          # Todo verify gera o relatório: sem ele, o caminho está errado, e o job falha (ADR-0005, D8).
          if-no-files-found: error

  image:
    name: Imagem Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Uma imagem por aplicação, com o mesmo Dockerfile (ADR-0002, D9; ADR-0006, D1). O module é o caminho do
        # módulo; o name, só o nome do check (ADR-0005, D8). O servidor de autorização tem repositório e imagem
        # próprios, que o e2e baixa do ghcr.io (ADR-0007).
        include:
          - name: api
            module: apps/api
            image: encurtador-api
            http-port: 8080
            management-port: 8081
          - name: redirect
            module: apps/redirect
            image: encurtador-redirect
            http-port: 8060
            management-port: 8061
          - name: bff
            module: apps/bff
            image: encurtador-bff
            http-port: 8070
            management-port: 8071
    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: >-
          docker build
          --secret id=github_actor,env=GITHUB_ACTOR
          --secret id=github_token,env=GITHUB_TOKEN
          --build-arg MODULE=${{ matrix.module }}
          --build-arg HTTP_PORT=${{ matrix.http-port }}
          --build-arg MANAGEMENT_PORT=${{ matrix.management-port }}
          -t ${{ matrix.image }}:ci .

  # A stack inteira do compose (ADR-0003, D12; ADR-0004, D11; ADR-0006): login pela CLI e o painel no Playwright, com
  # axe. Os dois conferem que o link curto sai do serviço de redirecionamento, e não da API.
  e2e:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json

      - name: Sobe a stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 300

      - name: Login pela CLI → link → redirecionamento → estatística → remoção
        run: e2e/cli/ponta-a-ponta.sh

      - name: Painel no Playwright
        working-directory: e2e/playwright
        env:
          CI: 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          if-no-files-found: ignore

      - name: Logs da stack
        if: failure()
        run: docker compose --profile app logs --no-color > compose.log

      - name: Guarda os logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore
