name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # Testcontainers usa o Docker disponível no runner (ADR-0001, D14).
      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: docker build -t encurtador-url:ci .
