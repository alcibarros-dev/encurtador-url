# Infraestrutura local (perfil "local"). Imagens fixadas por versão e portas presas a 127.0.0.1 (ADR-0001, D15).
# O PostgreSQL usa a porta 5433 no host para não conflitar com outros bancos locais na 5432.
#
# As aplicações em container ("auth-server", "app" e "bff") só sobem com o profile do compose:
#   docker compose --profile app up --build
# Sem o profile, o compose sobe só a infraestrutura, que é o que o perfil "local" do Spring Boot usa.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: encurtador
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql/<versão>/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador -d encurtador"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pgAdmin para consultar o PostgreSQL: http://localhost:16543
  # Modo desktop (sem login); o servidor do compose já vem cadastrado e conecta sem pedir senha.
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # A imagem exige os dois para iniciar, mas o modo desktop não os usa.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: encurtador
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "127.0.0.1:16543:80"
    volumes:
      # Servidor pré-cadastrado. A senha vem do PasswordExecCommand: no modo desktop, o pgAdmin roda o comando ao
      # conectar e usa a saída como senha. O arquivo só é lido na primeira subida (com o volume pgadmin_data vazio).
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Preferências e histórico de consultas.
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:8.8.4-alpine
    # Cache e contadores de rate limit: sem persistência de propósito (ADR-0001, D7).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interface web para inspecionar as chaves do Redis: http://localhost:8181
  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:0.9.1
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "127.0.0.1:8181:8081"
    # O healthcheck da imagem só roda a cada 60 s, e o spring-boot:run espera todos os containers ficarem saudáveis.
    healthcheck:
      test: ["CMD", "/redis-commander/bin/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: i-Hn_d5pTn-CUcFPTSbtyQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT para quem está no host (localhost:9092); DOCKER para os containers da rede do compose.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Kafdrop para ler tópicos, partições, mensagens e consumer groups do Kafka: http://localhost:9000
  kafdrop:
    image: obsidiandynamics/kafdrop:4.3.1
    environment:
      # Listener DOCKER: o PLAINTEXT anuncia localhost:9092, que dentro de outro container não leva ao Kafka.
      KAFKA_BROKERCONNECT: kafka:29092
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      kafka:
        condition: service_started

  # Servidor de autorização (ADR-0003, D11): login, cadastro, troca de senha e emissão dos tokens que o app valida.
  auth-server:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: auth-server
        HTTP_PORT: 8090
        MANAGEMENT_PORT: 8091
    image: encurtador-auth-server:local
    # Usa a chave de .secrets/auth-signing-key.pem se ela existir (gere com o comando do README). Sem ela, a chave é
    # gerada na subida, com kid único, e os tokens emitidos deixam de valer quando o container reinicia. A imagem em
    # si só lê a chave de AUTH_SIGNING_KEY_FILE.
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /run/secrets/encurtador/auth-signing-key.pem ]; then
          export AUTH_SIGNING_KEY_FILE=file:/run/secrets/encurtador/auth-signing-key.pem
        fi
        exec java -jar application.jar
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/encurtador
      SPRING_DATASOURCE_USERNAME: encurtador
      SPRING_DATASOURCE_PASSWORD: encurtador
      SPRING_DATA_REDIS_HOST: redis
      # URL pública: vai no "iss" dos tokens e é o endereço que o navegador e a CLI usam.
      AUTH_ISSUER: http://localhost:8090
      AUTH_SIGNING_KEY_ID: compose-1
      # Cliente encurtador-web, do BFF do painel (ADR-0004, D4). SOMENTE local: fora daqui, defina no .env.
      AUTH_WEB_CLIENT_SECRET: ${AUTH_WEB_CLIENT_SECRET:-compose-web-secret}
      AUTH_WEB_REDIRECT_URIS: http://localhost:8070/login/oauth2/code/encurtador
      AUTH_WEB_POST_LOGOUT_REDIRECT_URIS: http://localhost:8070/
      AUTH_PANEL_ORIGINS: http://localhost:8070
      AUTH_PANEL_DEFAULT_URL: http://localhost:8070/
    volumes:
      # .secrets/ fica fora do Git e da imagem.
      - ./.secrets:/run/secrets/encurtador:ro
    ports:
      - "127.0.0.1:8090:8090"
      # Actuator completo: nunca publicar fora da máquina ou da rede interna.
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    image: encurtador-url:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/encurtador
      SPRING_DATASOURCE_USERNAME: encurtador
      SPRING_DATASOURCE_PASSWORD: encurtador
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_BASE_URL: http://localhost:8080
      # Tokens do auth-server (ADR-0003, D6): o "iss" é a URL pública, e as chaves vêm pela rede interna. O app sobe
      # e continua validando tokens com as chaves em cache mesmo com o auth-server fora.
      APP_JWT_ISSUER: http://localhost:8090
      APP_JWT_JWK_SET_URI: http://auth-server:8090/oauth2/jwks
      # Swagger UI em http://localhost:8080/swagger-ui.html. Só este compose local liga a documentação; a imagem
      # continua com ela desligada por padrão (D9), e a segurança libera as rotas quando a propriedade está ligada.
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      # Actuator completo: nunca publicar fora da máquina ou da rede interna (D13).
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Não espera o Kafka ficar saudável: a aplicação sobe e redireciona sem ele (RNF02).
      kafka:
        condition: service_started

  # Painel (ADR-0004, D12): a SPA e o BFF, em http://localhost:8070.
  bff:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: bff
        HTTP_PORT: 8070
        MANAGEMENT_PORT: 8071
    image: encurtador-bff:local
    environment:
      SPRING_DATA_REDIS_HOST: redis
      APP_BASE_URL: http://localhost:8070
      BFF_API_URL: http://app:8080
      # O navegador vai ao auth-server por localhost:8090, que também é o "iss" dos tokens; o BFF, pela rede interna.
      BFF_AUTH_PUBLIC_URL: http://localhost:8090
      BFF_AUTH_INTERNAL_URL: http://auth-server:8090
      BFF_CLIENT_SECRET: ${AUTH_WEB_CLIENT_SECRET:-compose-web-secret}
      # Sem HTTPS no local: os cookies não podem ter o prefixo __Host- nem Secure.
      SERVER_SERVLET_SESSION_COOKIE_NAME: WEBSESSION
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      BFF_COOKIES_CSRF_NAME: XSRF-TOKEN
      BFF_COOKIES_SECURE: "false"
    ports:
      - "127.0.0.1:8070:8070"
      # Actuator completo: nunca publicar fora da máquina ou da rede interna.
      - "127.0.0.1:8071:8071"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  pgadmin_data:
