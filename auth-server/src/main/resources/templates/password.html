<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Trocar senha')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main class="cartao" id="conteudo">
    <h1>Trocar senha</h1>
    <p>Depois da troca, todas as sessões abertas com a senha antiga são encerradas.</p>
    <p class="erro" role="alert" th:if="${retryAfter}"
       th:text="|Muitas tentativas. Tente de novo em ${retryAfter} segundos.|">Muitas tentativas.</p>
    <form method="post" th:action="@{/account/password}" th:object="${form}" novalidate>
        <input type="hidden" name="continue" th:if="${continueTo}" th:value="${continueTo}">
        <label for="currentPassword">Senha atual</label>
        <input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required
               autofocus th:attr="aria-invalid=${#fields.hasErrors('currentPassword')}">
        <p class="erro-campo" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" name="newPassword" autocomplete="new-password" required
               aria-describedby="regra-senha" th:attr="aria-invalid=${#fields.hasErrors('newPassword')}">
        <p class="dica" id="regra-senha">De 8 a 64 caracteres, até 72 bytes.</p>
        <p class="erro-campo" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
        <button type="submit">Trocar senha</button>
    </form>
    <p th:if="${continueTo}"><a th:href="${continueTo}">Voltar ao painel</a></p>
</main>
</body>
</html>
